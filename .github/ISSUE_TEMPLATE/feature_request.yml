name: Feature request
description: Suggest a new tool or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, for example "I want to check …"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could NetPulse help? Which system tool could it use?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
