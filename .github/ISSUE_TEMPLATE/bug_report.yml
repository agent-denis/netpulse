name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems** go through SECURITY.md, not here.
        Please remove anything private (host names, IP addresses, tokens) from logs.
  - type: input
    id: version
    attributes:
      label: NetPulse version
      description: Output of `netpulse --version`
      placeholder: netpulse 1.0.0
    validations:
      required: true
  - type: input
    id: fedora
    attributes:
      label: Fedora version
      placeholder: Fedora 45 Workstation
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How do you run NetPulse?
      options:
        - Native window
        - Web browser (--browser or automatic fallback)
        - --no-open
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Which tool?
      placeholder: e.g. Traceroute
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Enter …
        3. …
  - type: textarea
    id: output
    attributes:
      label: Raw output or export (optional)
      description: The Raw output tab, or a JSON export of the result.
      render: text
