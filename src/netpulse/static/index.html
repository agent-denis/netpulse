<html lang="en" data-theme-pref="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>NetPulse</title>
  <link rel="icon" href="icons/netpulse.svg" type="image/svg+xml">
  <!-- Synchronous, before the stylesheet: sets data-theme so there is no flash. -->
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="app-header">
    <div class="brand">
      <img src="icons/netpulse.svg" alt="" width="28" height="28">
      <h1>NetPulse</h1>
    </div>
    <div class="header-actions">
      <fieldset class="segmented" id="theme-switch">
        <legend class="visually-hidden">Theme</legend>
        <input type="radio" name="theme" id="theme-system" value="system">
        <label for="theme-system">System</label>
        <input type="radio" name="theme" id="theme-light" value="light">
        <label for="theme-light">Light</label>
        <input type="radio" name="theme" id="theme-dark" value="dark">
        <label for="theme-dark">Dark</label>
      </fieldset>
      <button type="button" id="history-button" aria-haspopup="dialog">History</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Tools"></nav>
    <main id="main" tabindex="-1">
      <p class="muted" id="loading">Loading…</p>
      <noscript><p>NetPulse needs JavaScript to run.</p></noscript>
    </main>
  </div>

  <div id="live-region" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="alert-region" class="visually-hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <dialog id="history-dialog" aria-labelledby="history-title">
    <div class="dialog-head">
      <h2 id="history-title">History</h2>
      <button type="button" class="flat" id="history-close">Close</button>
    </div>
    <div class="dialog-body">
      <div class="history-tools">
        <label for="history-search" class="visually-hidden">Search history</label>
        <input type="search" id="history-search" placeholder="Search by tool, host or status…" autocomplete="off">
        <button type="button" class="danger" id="history-clear">Clear history</button>
      </div>
      <div class="notice warn confirm-box" id="history-confirm" role="alertdialog" aria-labelledby="history-confirm-text" hidden>
        <p id="history-confirm-text">Delete all saved runs? This cannot be undone.</p>
        <button type="button" class="danger-solid" id="history-confirm-yes">Delete all</button>
        <button type="button" id="history-confirm-no">Cancel</button>
      </div>
      <p class="muted" id="history-status" aria-live="polite"></p>
      <div class="table-wrap">
        <table class="data" id="history-table">
          <caption class="visually-hidden">Previous runs, newest first</caption>
          <thead>
            <tr><th scope="col">When</th><th scope="col">Tool</th><th scope="col">Target</th><th scope="col">Result</th><th scope="col">Duration</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <form class="history-prefs" id="history-prefs">
        <label class="check"><input type="checkbox" id="history-enabled"> Save runs to history</label>
        <span class="inline-field">
          <label for="history-max">Keep at most</label>
          <input type="number" id="history-max" min="10" max="10000" step="10">
          <span>runs</span>
        </span>
        <button type="submit">Save</button>
        <span class="muted" id="history-path"></span>
      </form>
    </div>
  </dialog>
</body>
</html>
